[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pop-sim"
version = "2.2.0"
description = "PoS v1: simulation of Proof of Pseudonym, a blockchain-based privacy-preserving pseudonym shuffling protocol for ITS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["cryptography>=41", "matplotlib>=3.7", "numpy>=1.24", "coincurve>=19"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
pop-sim = "pop_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set so that CI results do not depend on the ruff release's defaults.
select = ["E4", "E7", "E9", "F", "I", "BLE"]
