# Repository housekeeping that needs write access the cloud session does not
# have: delete a stale branch, create an annotated tag, publish a release.
# Run it from the Actions tab (workflow_dispatch); every step is opt-in.
name: tidy-release

on:
  workflow_dispatch:
    inputs:
      delete_branch:
        description: "Branch to delete (empty: skip)"
        required: false
        default: ""
      tag:
        description: "Tag to create (empty: skip)"
        required: false
        default: ""
      tag_sha:
        description: "Commit the tag points at (empty: the dispatched ref)"
        required: false
        default: ""
      create_release:
        description: "Publish a GitHub release for the tag"
        required: false
        type: boolean
        default: false
      republish:
        description: "Delete the tag's existing release first, then publish it again"
        required: false
        type: boolean
        default: false
      move_tag:
        description: "Move an existing tag to tag_sha (or the dispatched ref) instead of keeping it"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete branch
        if: inputs.delete_branch != ''
        run: git push origin --delete "${{ inputs.delete_branch }}"
      - name: Create or move tag
        if: inputs.tag != ''
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ inputs.tag }}" >/dev/null; then
            if [ "${{ inputs.move_tag }}" != "true" ]; then
              echo "tag ${{ inputs.tag }} already exists; keeping it"
              exit 0
            fi
            echo "moving tag ${{ inputs.tag }}"
            git push origin ":refs/tags/${{ inputs.tag }}"
            git tag -d "${{ inputs.tag }}" 2>/dev/null || true
          fi
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          sha="${{ inputs.tag_sha }}"; [ -n "$sha" ] || sha="$GITHUB_SHA"
          git tag -a "${{ inputs.tag }}" "$sha" -m "PoS v1 ${{ inputs.tag }}"
          git push origin "refs/tags/${{ inputs.tag }}"
      - name: Delete the existing release (republish)
        if: inputs.republish && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ inputs.tag }}" --yes || echo "no release for ${{ inputs.tag }} yet"
      - name: Create release
        if: (inputs.create_release || inputs.republish) && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin "refs/tags/${{ inputs.tag }}:refs/tags/${{ inputs.tag }}" --force
          notes=$(git show "${{ inputs.tag }}:CHANGELOG.md" | awk '/^## /{n++} n==1')
          gh release create "${{ inputs.tag }}" --title "${{ inputs.tag }}" --notes "$notes" --verify-tag
